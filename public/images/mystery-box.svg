<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <rect width="600" height="600" fill="#F4F4F5"/>
  <path d="M0 470H600" stroke="#E4E4E7" stroke-width="1.5"/>
  <g transform="translate(150 115)">
    <!-- Isometric Box Top Flap -->
    <polygon points="150,10 290,78 150,146 10,78" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
    <!-- Left Face -->
    <polygon points="10,78 150,146 150,350 10,282" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="290,78 150,146 150,350 290,282" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="2"/>
    <!-- Seal Ribbon on Top -->
    <line x1="80" y1="44" x2="220" y2="112" stroke="#EA580C" stroke-width="3.5"/>
    <!-- Center Emblem on Left Face -->
    <rect x="44" y="168" width="72" height="72" rx="10" transform="skewY(25)" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="80" y="256" text-anchor="middle" fill="#EA580C" font-family="monospace" font-size="44" font-weight="800">?</text>
    <!-- Series Label on Right Face -->
    <text x="220" y="232" text-anchor="middle" fill="#09090B" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">RICKIEST</text>
    <text x="220" y="256" text-anchor="middle" fill="#71717A" font-family="monospace" font-size="11" letter-spacing="1.5">BLIND BOX</text>
    <line x1="184" y1="274" x2="256" y2="274" stroke="#EA580C" stroke-width="2.5"/>
  </g>
</svg>
