<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <rect width="600" height="600" fill="#09090B"/>
  <!-- Subtle architectural grid lines -->
  <path d="M0 470H600" stroke="#1E293B" stroke-width="1"/>
  <g transform="translate(150 115)">
    <!-- Isometric Box Top Flap -->
    <polygon points="150,10 290,78 150,146 10,78" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="10,78 150,146 150,350 10,282" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="290,78 150,146 150,350 290,282" fill="#020617" stroke="#334155" stroke-width="2"/>
    <!-- Seal Ribbon on Top -->
    <line x1="80" y1="44" x2="220" y2="112" stroke="#F59E0B" stroke-width="3"/>
    <!-- Center Emblem on Left Face -->
    <rect x="44" y="168" width="72" height="72" rx="10" transform="skewY(25)" fill="#020617" stroke="#F59E0B" stroke-width="2"/>
    <text x="80" y="256" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="44" font-weight="800">?</text>
    <!-- Series Label on Right Face -->
    <text x="220" y="232" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">RICKIEST</text>
    <text x="220" y="256" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1.5">BLIND BOX</text>
    <line x1="184" y1="274" x2="256" y2="274" stroke="#F59E0B" stroke-width="2"/>
  </g>
</svg>
